<div class="min-h-screen bg-gray-100 text-gray-900 flex justify-center">
  <div class="max-w-screen-xl m-0 sm:m-10 bg-white shadow sm:rounded-lg flex justify-center flex-1">
      <div class="lg:w-1/2 xl:w-5/12 p-6 sm:p-12">
          <div class="flex justify-center">
              <img src="../../../../assets/logo.png"
                  class="w-[12rem]" />
          </div>
          <div class="mt-2 flex flex-col items-center">
              <div class="w-full flex-1 mt-4">
                  <div class="flex flex-col items-center">
                      <button
                          class="w-full max-w-xs font-bold shadow-sm rounded-lg py-3 bg-accent text-primary flex items-center justify-center transition-all duration-300 ease-in-out focus:outline-none hover:shadow focus:shadow-sm focus:shadow-outline">
                          <div class="bg-primary p-2 rounded-full">
                            <svg class="w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#f8bd0d"><path d="M12 2C17.5228 2 22 6.47715 22 12C22 14.1364 21.3301 16.1162 20.1889 17.741L17 12H20C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C14.1502 20 16.1023 19.1517 17.5398 17.7716L18.5379 19.567C16.7848 21.083 14.4995 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2ZM12 7C13.6569 7 15 8.34315 15 10V11H16V16H8V11H9V10C9 8.34315 10.3431 7 12 7ZM14 13H10V14H14V13ZM12 9C11.4872 9 11.0645 9.38604 11.0067 9.88338L11 10V11H13V10C13 9.48716 12.614 9.06449 12.1166 9.00673L12 9Z"></path></svg>
                          </div>
                          <span class="ml-4">
                              Se connecter
                          </span>
                      </button>

                  </div>

                  <div class="my-6 border-b text-center">
                      <div
                          class="leading-none px-2 inline-block text-sm text-gray-600 tracking-wide font-medium bg-white transform translate-y-1/2">
                          mot de passe oublier ?
                      </div>
                  </div>

                  <form class="mx-auto max-w-xs" [formGroup]="formAuthenticate" (ngSubmit)="login()">
                      <input
                          class="w-full px-8 py-4 rounded-lg font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-gray-400 focus:bg-white"
                          type="text" name="username" placeholder="username" formControlName="username" />
                      <input
                          class="w-full px-8 py-4 rounded-lg font-medium bg-gray-100 border border-gray-200 placeholder-gray-500 text-sm focus:outline-none focus:border-gray-400 focus:bg-white mt-5"
                          type="password" placeholder="Password" formControlName="password" name="password" />
                      <button (click)="login()"
                          class="mt-5 tracking-wide font-semibold bg-primary text-white w-full py-4 rounded-lg hover:bg-green-700 transition-all duration-300 ease-in-out flex items-center justify-center focus:shadow-outline focus:outline-none">
                          <svg class="w-6 h-6 -ml-2" fill="none" stroke="white" stroke-width="2"
                              stroke-linecap="round" stroke-linejoin="round">
                              <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                              <circle cx="8.5" cy="7" r="4" />
                              <path d="M20 8v6M23 11h-6" />
                          </svg>
                          <span class="ml-2">
                              Connexion
                          </span>
                      </button>
                    </form>
              </div>
          </div>
      </div>
      <div class="flex-1 bg-green-100 text-center hidden lg:flex" style="background-image: url('../../../../assets/fond_login.jpg');background-size: cover;">

      </div>
  </div>
</div>


<app-loader *ngIf="actifLoader"></app-loader>
